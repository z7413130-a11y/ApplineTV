name: Build APK (ApplineTV)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:        # можно запускать вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Show project layout
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la
          echo "--- build.sh head ---"
          head -40 build.sh || true

      - name: Make build script executable
        run: |
          chmod +x build.sh
          # если внутри build.sh вызываются другие скрипты — тоже
          find . -maxdepth 2 -name "*.sh" -not -path "./.git/*" -exec chmod +x {} \;

      - name: Build APK
        run: |
          # build.sh обычно читает ANDROID_HOME / ANDROID_SDK_ROOT из env — они уже есть
          bash ./build.sh

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find . -type f -name "*.apk" -not -path "./.git/*" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK не найден — проверь вывод build.sh"
            exit 1
          fi
          echo "APK=$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ApplineTV-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
